<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Prop Monitor</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb; --page: #f9f9f7; --ink-1: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --border: rgba(11,11,11,0.10); --grid: #e1e0d9;
    --green: #1baf7a; --orange: #eb6834; --blue: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --page: #0d0d0d; --ink-1: #f0efec; --ink-2: #c3c2b7;
      --border: rgba(255,255,255,0.10); --grid: #2c2c2a;
      --green: #199e70; --orange: #d95926; --blue: #3987e5;
    }
  }
  body { margin:0; background:var(--page); color:var(--ink-1);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width: 1000px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:18px; margin:0; }
  .top { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  .meta { font-size:12.5px; color:var(--ink-2); }
  .games { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }
  .gamechip { background:var(--surface); border:1px solid var(--border); border-radius:8px;
              padding:6px 12px; font-size:12.5px; color:var(--ink-2); }
  .gamechip b { color:var(--ink-1); font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; background:var(--surface);
          border:1px solid var(--border); border-radius:12px; overflow:hidden; font-size:13.5px; }
  th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;
       color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--grid); font-weight:600; }
  td { padding:9px 12px; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:none; }
  tr.TRIGGER { background:color-mix(in srgb, var(--green) 10%, transparent); }
  tr.NEAR    { background:color-mix(in srgb, var(--orange) 8%, transparent); }
  .chip { font-size:11px; font-weight:600; border-radius:9px; padding:2px 8px; }
  .chip.TRIGGER { color:#fff; background:var(--green); }
  .chip.NEAR { color:#fff; background:var(--orange); }
  .chip.watch { color:var(--muted); border:1px solid var(--muted); }
  .pbar { display:inline-block; width:70px; height:6px; border-radius:3px; background:var(--grid);
          vertical-align:2px; margin-right:7px; }
  .pbar i { display:block; height:100%; border-radius:3px; background:var(--blue); }
  #empty { color:var(--muted); padding:30px; text-align:center; background:var(--surface);
           border:1px solid var(--border); border-radius:12px; font-size:14px; }
  button { background:var(--surface); color:var(--ink-1); border:1px solid var(--border);
           border-radius:8px; padding:5px 12px; font-size:12.5px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Live Prop Monitor</h1>
    <span class="meta">
      <button id="notifbtn" onclick="askNotif()">enable notifications</button>
      updated <span id="updated">—</span>
    </span>
  </div>
  <div class="games" id="games"></div>
  <div id="content"></div>
</div>
<script>
let known = {};   // id -> last status, for browser notifications

function askNotif() {
  Notification.requestPermission().then(p => {
    document.getElementById("notifbtn").textContent = "notifications: " + p;
  });
}
if ("Notification" in window && Notification.permission === "granted")
  document.getElementById("notifbtn").textContent = "notifications: granted";

async function refresh() {
  let d;
  try { d = await (await fetch("state.json?" + Date.now())).json(); }
  catch (e) { return; }
  document.getElementById("updated").textContent = d.updated;
  document.getElementById("games").innerHTML = (d.games || []).map(g =>
    `<span class="gamechip">${g.label} <b>${g.score}</b> · ${g.clock}</span>`).join("");
  const opps = d.opps || [];
  if (!opps.length) {
    document.getElementById("content").innerHTML =
      `<div id="empty">No live tracked players right now. The table fills in as games go live.</div>`;
    return;
  }
  let rows = opps.map(o => `
    <tr class="${o.status}">
      <td><b>${o.player}</b> <span style="color:var(--muted)">${o.market}</span></td>
      <td>${o.game}</td><td>${o.clock}</td>
      <td>O ${o.line}</td><td>${o.cum}</td><td>${o.events}</td><td>${o.drought}m</td>
      <td><span class="pbar"><i style="width:${Math.min(o.p/0.8*100,100)}%"></i></span>${o.p.toFixed(2)}</td>
      <td><span class="chip ${o.status}">${o.status}</span></td>
    </tr>`).join("");
  document.getElementById("content").innerHTML = `
    <table><thead><tr>
      <th>player</th><th>game</th><th>clock</th><th>line</th><th>yds</th>
      <th>tgt/car</th><th>drought</th><th>P(over)</th><th>status</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  for (const o of opps) {
    if ((o.status === "NEAR" || o.status === "TRIGGER") && known[o.id] !== o.status
        && "Notification" in window && Notification.permission === "granted") {
      new Notification((o.status === "TRIGGER" ? "🔔 TRIGGER: " : "Approaching: ") + o.player,
        { body: `${o.market} O${o.line} · ${o.cum} yds · P=${o.p.toFixed(2)} · ${o.clock}` });
    }
    known[o.id] = o.status;
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
