# Fly.io app: dashboard + the three pollers on one always-on machine.
# Change `app` if the name is taken (Fly app names are global).
app = "live-betting-value"
primary_region = "iad"
swap_size_mb = 512   # headroom: three pollers + server in 256 MB RAM

[build]

[[mounts]]
  source = "lbv_data"
  destination = "/data"

[http_service]
  internal_port = 8766
  force_https = true
  auto_stop_machines = "off"   # pollers must keep running with nobody watching
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
