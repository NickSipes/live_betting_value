<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Prop Monitor</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #fcfcfb; --surface-2: #f3f3f0; --page: #f9f9f7;
    --ink-1: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --border: rgba(11,11,11,0.10); --grid: #e1e0d9; --baseline: #c3c2b7;
    --green: #1baf7a; --orange: #eb6834; --blue: #2a78d6; --red: #d03b3b; --yellow: #c98500;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --surface-2: #232322; --page: #0d0d0d;
      --ink-1: #f0efec; --ink-2: #c3c2b7;
      --border: rgba(255,255,255,0.10); --grid: #2c2c2a; --baseline: #383835;
      --green: #199e70; --orange: #d95926; --blue: #3987e5; --red: #e66767; --yellow: #eda100;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--ink-1);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:1060px; margin:0 auto; padding:20px 16px 60px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  h1 { font-size:19px; margin:0; letter-spacing:-0.01em; }
  .meta { font-size:12.5px; color:var(--ink-2); }
  button { background:var(--surface); color:var(--ink-1); border:1px solid var(--border);
           border-radius:8px; padding:5px 12px; font-size:12.5px; cursor:pointer; }
  #stale { display:none; margin:12px 0; padding:10px 14px; border-radius:10px; font-size:13px;
           background:color-mix(in srgb, var(--orange) 12%, transparent); border:1px solid var(--orange); }
  details.sect { margin-top:18px; }
  details.sect > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
    font-size:15px; font-weight:650; padding:10px 2px; border-bottom:1px solid var(--grid); user-select:none; }
  details.sect > summary::-webkit-details-marker { display:none; }
  details.sect > summary::before { content:"▸"; color:var(--muted); font-size:12px; transition:transform .15s; }
  details.sect[open] > summary::before { transform:rotate(90deg); }
  .count { font-size:12px; color:var(--muted); font-weight:500; }
  .leg { font-size:12px; color:var(--ink-2); margin:10px 0 2px; line-height:2; }
  .chip { font-size:10.5px; font-weight:650; border-radius:9px; padding:2px 8px; letter-spacing:.02em; }
  .chip.hot { color:#fff; background:var(--green); }
  .chip.warm { color:#fff; background:var(--orange); }
  .chip.watch { color:var(--muted); border:1px solid var(--baseline); }
  .chip.pre { color:var(--ink-2); background:var(--surface-2); border:1px solid var(--border); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:12px; margin-top:12px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px;
          padding:13px 15px; cursor:pointer; transition:transform .1s, box-shadow .1s;
          border-left:3px solid transparent; }
  .card:hover { transform:translateY(-1px); box-shadow:0 3px 14px rgba(0,0,0,.14); }
  .card.hot { border-left-color:var(--green); }
  .card.warm { border-left-color:var(--orange); }
  .trow { display:flex; align-items:center; gap:8px; margin:2px 0; }
  .trow img { width:22px; height:22px; object-fit:contain; }
  .trow .ab { font-weight:650; width:48px; }
  .trow .sc { font-size:17px; font-weight:700; margin-left:auto; font-variant-numeric:tabular-nums; }
  .sub { font-size:12px; color:var(--ink-2); margin-top:7px; display:flex; justify-content:space-between; gap:6px; flex-wrap:wrap; }
  .nums { display:flex; gap:14px; margin-top:9px; font-size:12.5px; font-variant-numeric:tabular-nums; flex-wrap:wrap; }
  .nums div span { display:block; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
  .nums b { font-weight:650; }
  .pbar { width:100%; height:5px; border-radius:3px; background:var(--grid); margin-top:10px; }
  .pbar i { display:block; height:100%; border-radius:3px; background:var(--blue); }
  .empty { color:var(--muted); padding:26px; text-align:center; background:var(--surface);
           border:1px solid var(--border); border-radius:14px; font-size:13.5px; margin-top:12px; }
  #overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50;
             align-items:center; justify-content:center; padding:16px; }
  #modal { background:var(--surface); border:1px solid var(--border); border-radius:16px;
           max-width:760px; width:100%; max-height:88vh; overflow:hidden; padding:18px 22px 12px;
           display:flex; flex-direction:column; position:relative; }
  #modal > *:not(#evlist) { flex-shrink:0; }
  .mclose { position:absolute; top:8px; right:10px; border:none; background:transparent;
            font-size:17px; color:var(--muted); padding:6px 8px; z-index:2; }
  #modal h3 { margin:0 0 2px; font-size:16px; display:flex; align-items:center; gap:8px; }
  #modal h3 img { width:24px; height:24px; }
  #modal .meta { margin-bottom:10px; }

  /* scorebug */
  .bug { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin:0 26px 12px; }
  .bug .tm { display:flex; align-items:center; gap:10px; }
  .bug .tm.home { justify-content:flex-end; }
  .bug img { width:32px; height:32px; object-fit:contain; }
  .bug .ab { font-size:12px; font-weight:650; color:var(--ink-2); letter-spacing:.03em; }
  .bug .sc { font-size:26px; font-weight:750; font-variant-numeric:tabular-nums; line-height:1; }
  .bug .mid { text-align:center; }
  .bug .clk { font-size:13px; font-weight:650; }
  .bug .st { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  /* cursor readout */
  #mread { background:var(--surface-2); border-radius:10px; padding:8px 12px 9px; margin-bottom:4px; }
  #mread .rtop { display:flex; justify-content:space-between; align-items:baseline; gap:10px; min-height:17px; }
  #mread .rclk { font-size:13px; font-weight:650; font-variant-numeric:tabular-nums; }
  #mread .rsit { font-size:11.5px; color:var(--ink-2); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #mread .rstats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:6px; }
  #mread .rstats span { display:block; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  #mread .rstats b { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }

  .mleg { display:flex; justify-content:center; flex-wrap:wrap; gap:4px 14px; font-size:11px;
          color:var(--ink-2); margin:2px 0 8px; }
  .mleg i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:0; }

  /* play list */
  #evlist { flex:1 1 auto; min-height:80px; max-height:240px; overflow-y:auto;
            border-top:1px solid var(--grid); margin:0 -4px; padding:0 4px; }
  .ev { display:grid; grid-template-columns:62px 1fr auto; gap:2px 10px; padding:10px 8px;
        border-bottom:1px solid var(--grid); cursor:pointer; border-radius:8px; }
  .ev:hover { background:var(--surface-2); }
  .ev.on { background:var(--surface-2); box-shadow:inset 3px 0 0 var(--orange); }
  .ev .clk { font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:1px; white-space:nowrap; }
  .ev .ttl { font-size:13px; font-weight:650; }
  .ev .sc { font-size:12px; font-weight:650; color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .ev .txt { grid-column:2 / 4; font-size:12px; color:var(--ink-2); line-height:1.4;
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  @media (max-width: 640px) {
    #overlay { padding:0; align-items:flex-end; }
    #modal { max-width:none; height:92vh; height:92dvh; max-height:92dvh; border-radius:18px 18px 0 0;
             border-bottom:none; padding:12px 14px 6px; }
    #modal::before { content:""; display:block; width:36px; height:4px; border-radius:2px;
                     background:var(--baseline); margin:0 auto 10px; flex-shrink:0; }
    .bug { margin:0 22px 10px; }
    .bug img { width:28px; height:28px; }
    .bug .sc { font-size:24px; }
    #evlist { max-height:none; }
  }
  svg { display:block; width:100%; height:auto; }
  svg text { font-family:inherit; }
  .tick { font-size:10.5px; fill:var(--muted); }
  .evrow { font-size:12.5px; padding:6px 0; border-top:1px solid var(--grid); color:var(--ink-2); }
  .evrow b { color:var(--ink-1); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:-1px; }
  .nav { position:sticky; top:0; z-index:10; background:var(--page); padding:14px 0 10px;
         margin:-20px 0 4px; border-bottom:1px solid var(--grid); }
  .tabs { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .tabs button { border-radius:999px; padding:6px 14px; font-weight:600; font-size:13px; color:var(--ink-2); }
  .tabs button.on { background:var(--ink-1); color:var(--page); border-color:var(--ink-1); }
  .tabs.sport button { font-size:14px; padding:7px 18px; }
  .tabs .n { font-size:11px; opacity:.7; margin-left:4px; }
  .tabs .livedot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--red);
                   margin-right:6px; vertical-align:1px; }
  .weeks { display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; align-items:center; }
  .weeks .lbl { font-size:12px; color:var(--muted); margin-right:4px; }
  .weeks button { padding:4px 11px; font-size:12px; border-radius:8px; }
  .weeks button.on { background:var(--surface-2); border-color:var(--ink-2); color:var(--ink-1); font-weight:650; }
  .card.final { cursor:default; }
  .card.click { cursor:pointer; }
  .card.final:not(.click):hover { transform:none; box-shadow:none; }
  .trow .sc.lose, .trow .ab.lose { color:var(--muted); font-weight:500; }
  .kick { font-size:12.5px; font-weight:600; color:var(--ink-1); }
  .mk { font-size:12.5px; color:var(--ink-2); margin-top:5px; }
  .mk b { font-size:15px; color:var(--ink-1); margin-left:4px; font-variant-numeric:tabular-nums; }
  .star { color:var(--yellow); margin-left:5px; font-size:13px; }
  @keyframes callflash { 0%, 100% { background:transparent; }
                         50% { background:color-mix(in srgb, var(--green) 24%, transparent); } }
  details.sect.flash > summary { animation:callflash .75s ease-in-out 4; border-radius:8px; }
  .card.new { animation:callflash .75s ease-in-out 4; }
  .cbets { margin:2px 0 6px; }
  .cbets .ttl { font-size:12px; font-weight:650; color:var(--ink-1); margin-bottom:4px; }
  .cbets table { margin-top:0; font-size:12.5px; border-radius:10px; }
  .cbets th { font-size:10px; padding:6px 10px; }
  .cbets td { padding:7px 10px; font-variant-numeric:tabular-nums; }
  .cbets th, .cbets td { white-space:nowrap; }
  @media (max-width: 640px) { .cbets th, .cbets td { padding:6px 7px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <div class="top">
      <h1>Live Prop Monitor</h1>
      <span class="meta">
        <button id="notifbtn" onclick="askNotif()">enable notifications</button>
        updated <span id="updated">—</span>
      </span>
    </div>
    <div class="tabs sport" id="sporttabs"></div>
    <div class="tabs" id="viewtabs"></div>
  </div>
  <div id="stale"></div>
  <div class="weeks" id="weeks"></div>
  <div id="view"></div>
</div>

<div id="overlay" onclick="if(event.target===this) closeModal()">
  <div id="modal"></div>
</div>

<script>
let notifStore = {};
let lastTs = { props: null, nflsp: null, cfb: null };
let S = { props: null, watch: null, watchT: 0, nflHist: {}, spread: { nflsp: null, cfb: null },
          spreadHist: { nflsp: {}, cfb: {} }, games: { nfl: {}, cfb: {} }, arch: {}, parch: {} };
const SPREADS = {
  nflsp: { state: "nfl_spreads_state.json", hist: "nfl_spread_history.json" },
  cfb: { state: "cfb_state.json", hist: "cfb_history.json" },
};
const KINDOF = { nfl: "nflsp", cfb: "cfb" };
const SPORTOF = { nflsp: "nfl", cfb: "cfb" };
const SPORTNAME = { nfl: "NFL", cfb: "NCAAF" };

// ---------- routing: #sport/view[/week[/game]] ----------
let R = { sport: "nfl", view: "live", week: null, game: null };
function readHash() {
  const [s, v, w, g] = location.hash.slice(1).split("/");
  R.sport = s === "cfb" ? "cfb" : "nfl";
  R.view = ["live", "upcoming", "past"].includes(v) ? v : "live";
  R.week = w ? +w : null;
  R.game = g || null;
}
const go = (...parts) => { location.hash = parts.filter(x => x !== null && x !== undefined).join("/"); };
window.addEventListener("hashchange", () => { readHash(); render(); window.scrollTo(0, 0); });
readHash();

// collapsed sections survive re-renders (and reloads, when storage works)
let closed = new Set();
try { closed = new Set(JSON.parse(localStorage.getItem("closedSections") || "[]")); } catch (e) {}
function secToggle(key, open) {
  open ? closed.delete(key) : closed.add(key);
  try { localStorage.setItem("closedSections", JSON.stringify([...closed])); } catch (e) {}
}

function askNotif() {
  Notification.requestPermission().then(p => {
    document.getElementById("notifbtn").textContent = "notifications: " + p;
  });
}
if ("Notification" in window && Notification.permission === "granted")
  document.getElementById("notifbtn").textContent = "notifications: granted";

const ageText = ts => {
  if (!ts) return "—";
  const m = (Date.now() / 1000 - ts) / 60;
  return m < 1 ? "just now" : m < 90 ? `${Math.round(m)}m ago` : `${(m / 60).toFixed(1)}h ago`;
};
function renderAges() {
  document.getElementById("updated").textContent =
    `props ${ageText(lastTs.props)} · NFL ${ageText(lastTs.nflsp)} · CFB ${ageText(lastTs.cfb)}`;
  const stale = [];
  for (const [k, ts] of Object.entries(lastTs))
    if (ts && (Date.now() / 1000 - ts) > 900) stale.push(`${k} data is ${ageText(ts).replace(" ago", "")} old`);
  const el = document.getElementById("stale");
  el.style.display = stale.length ? "block" : "none";
  el.textContent = stale.length ? "⚠ " + stale.join(" · ") + " — lines shown are likely outdated." : "";
}
setInterval(renderAges, 5000);

const chipCls = s => s === "TRIGGER" || s === "EDGE" ? "hot" : s === "NEAR" || s === "SWING" ? "warm" : "watch";
const fmtS = (v, g) => v === null || v === undefined ? "—" :
  v === 0 ? "PK" : v < 0 ? `${g.habbr} ${v}` : `${g.aabbr} -${v}`;
const logoImg = u => u ? `<img src="${u}" alt="" loading="lazy">` : `<span style="width:22px"></span>`;
const nflLogo = ab => ab ? `https://a.espncdn.com/i/teamlogos/nfl/500/${ab.toLowerCase()}.png` : null;
const kickTxt = iso => iso ? new Date(iso).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : "";
const mkt = m => m === "rec" ? "receiving" : "rushing";
const MKT = m => m === "rec" ? "Receiving yds" : "Rushing yds";
const P_MIN = 0.5;   // cards below this P(over) are hidden
// a 70% call wins once the player clears the line from the moment of the call;
// the poller settles it (result) live on a win, or at the final on a loss
const won = (call, yds) => !!call && (call.result ? call.result === "win" : yds > call.line);
const onWatch = (player, market) => (S.watch?.entries || []).some(w => w.player === player && w.market === market);
const star = (player, market) => onWatch(player, market) ? `<span class="star" title="Good Matchup" aria-label="Good Matchup">★</span>` : "";

function notifyIf(id, status, title, body) {
  if (["NEAR", "TRIGGER", "EDGE", "SWING"].includes(status) && notifStore[id] !== status
      && "Notification" in window && Notification.permission === "granted")
    new Notification(title, { body });
  notifStore[id] = status;
}

// click handlers are registered per render so names with quotes never break markup
let H = [];
const on = fn => `onclick="H[${H.push(fn) - 1}]()"`;

// ---------- cards ----------
function propLiveCard(o) {
  return `
  <div class="card ${chipCls(o.status)} click" ${on(() => openProp(o.id))}>
    <div class="trow">${logoImg(o.logo)}
      <span class="ab" style="width:auto;font-size:14px">${o.player}${star(o.player, o.market)}</span>
      <span class="chip ${chipCls(o.status)}" style="margin-left:auto">${o.status === "watch" ? "LIVE" : o.status.toUpperCase()}</span>
    </div>
    <div class="mk">${MKT(o.market)}<b>O ${o.line}</b></div>
    <div class="sub"><span>${o.game} · ${o.clock}</span></div>
    <div class="nums">
      <div><span>yards</span><b>${o.cum}</b></div>
      <div><span>tgt/car</span><b>${o.events}</b></div>
      <div><span>drought</span><b>${o.drought}m</b></div>
      <div><span>Probability</span><b>${o.p.toFixed(2)}</b></div>
    </div>
    <div class="pbar"><i style="width:${Math.min(o.p / 0.8 * 100, 100)}%"></i></div>
  </div>`;
}
// same layout as propLiveCard, but for the called line: progress bar = yards toward it
function callCard(c, isNew) {
  const o = c.o, pre = c.type === "pregame";
  return `
  <div class="card ${pre ? "" : "hot"} click ${isNew ? "new" : ""}" ${on(() => openProp(o.id))}>
    <div class="trow">${logoImg(o.logo)}
      <span class="ab" style="width:auto;font-size:14px">${c.player}${star(c.player, c.market)}</span>
      <span class="chip ${pre ? "pre" : "hot"}" style="margin-left:auto">${pre ? "PREGAME" : "MODEL PICK"}</span>
    </div>
    <div class="mk">${MKT(c.market)}<b>O ${c.line}</b></div>
    <div class="sub"><span>${o.game} · ${o.clock}</span></div>
    <div class="nums">
      <div><span>yards</span><b>${o.cum}</b></div>
      <div><span>needed</span><b>${Math.max(0, Math.ceil(c.line - o.cum))}</b></div>
      <div><span>called</span><b>${pre ? "pregame" : c.clock}</b></div>
      <div><span>Probability</span><b>${o.p ? o.p.toFixed(2) : "—"}</b></div>
    </div>
    <div class="pbar"><i style="width:${Math.min(o.cum / c.line * 100, 100)}%"></i></div>
  </div>`;
}
const callsOf = o => [o.pre, o.call].filter(Boolean).map(c => ({
  ...c, type: c.type || "live", player: o.player, market: o.market, id: `${o.id}|${c.type || "live"}`, o }));
function propPreCard(w, chip = "PREGAME") {
  return `
  <div class="card final">
    <div class="trow">${logoImg(nflLogo(w.team))}
      <span class="ab" style="width:auto;font-size:14px">${w.player}</span>
      <span class="chip pre" style="margin-left:auto">${chip}</span>
    </div>
    <div class="mk">${MKT(w.market)}<b>${w.ypg} ypg</b></div>
    <div class="sub"><span>${w.pos} #${w.rank} at position</span></div>
    <div class="trow" style="margin-top:8px">${logoImg(nflLogo(w.opp))}
      <span style="font-size:12.5px; color:var(--ink-2)">vs ${w.opp} — #${w.def_rank} worst vs ${w.pos} (${w.def_ypg} ypg)</span>
    </div>
    <div class="sub"><span>${w.game}</span><span class="kick">${kickTxt(w.kick_iso) || w.kick}</span></div>
  </div>`;
}
function spreadLiveCard(kind, g) {
  const [as, hs] = (g.score || "0-0").split("-");
  return `
  <div class="card ${chipCls(g.status)} click" ${on(() => openSpread(kind, g.id))}>
    <div class="trow">${logoImg(g.alogo)}<span class="ab">${g.aabbr ?? ""}</span>
      ${g.poss_side === "away" ? "🏈" : ""}<span class="sc">${as}</span></div>
    <div class="trow">${logoImg(g.hlogo)}<span class="ab">${g.habbr ?? ""}</span>
      ${g.poss_side === "home" ? "🏈" : ""}<span class="sc">${hs}</span></div>
    <div class="sub"><span>${g.clock}</span><span>${g.poss ?? ""}</span>
      <span class="chip ${chipCls(g.status)}">${g.status.toUpperCase()}</span></div>
    <div class="nums">
      <div><span>pregame</span><b>${fmtS(g.pregame, g)}</b></div>
      <div><span>live</span><b>${fmtS(g.line, g)}</b></div>
      <div><span>fair</span><b>${fmtS(g.fair, g)}</b></div>
      <div><span>edge</span><b>${g.edge ?? "—"}${g.side ? " " + g.side : ""}</b></div>
    </div>
  </div>`;
}
function upcomingCard(r) {
  return `
  <div class="card final">
    <div class="trow">${logoImg(r.alogo)}<span class="ab">${r.aabbr}</span></div>
    <div class="trow">${logoImg(r.hlogo)}<span class="ab">${r.habbr}</span></div>
    <div class="sub"><span class="kick">${kickTxt(r.date)}</span>
      <span>${r.pregame === null || r.pregame === undefined ? "no line yet" : "spread " + fmtS(r.pregame, r)}</span></div>
  </div>`;
}
// NFL final cards open the game page (props + spread); CFB has no props, so they open the spread chart
function finalCard(sport, id, r, props) {
  const aw = r.as > r.hs, hw = r.hs > r.as, nfl = sport === "nfl", click = nfl || r.has_hist;
  const pg = r.pregame ?? S.arch[`${sport}_w${r.week}`]?.[id]?.pregame;
  const calls = (props || []).map(([, p]) => p.call || p.pre).filter(Boolean), w = calls.filter(c => c.result === "win").length;
  const open = nfl ? () => go(sport, "past", r.week, id) : () => openSpread(KINDOF[sport], id);
  return `
  <div class="card final ${click ? "click" : ""}" ${click ? on(open) : ""}>
    <div class="trow">${logoImg(r.alogo)}<span class="ab ${hw ? "lose" : ""}">${r.aabbr}</span>
      <span class="sc ${hw ? "lose" : ""}">${r.as ?? ""}</span></div>
    <div class="trow">${logoImg(r.hlogo)}<span class="ab ${aw ? "lose" : ""}">${r.habbr}</span>
      <span class="sc ${aw ? "lose" : ""}">${r.hs ?? ""}</span></div>
    <div class="sub"><span>${r.detail || "Final"} · ${new Date(r.date).toLocaleDateString([], { month: "short", day: "numeric" })}</span>
      <span>pregame ${fmtS(pg, r)}</span></div>
    ${nfl ? `<div class="sub"><span>${props.length ? `${props.length} props${calls.length ? ` · calls ${w}–${calls.length - w}` : ""}` : "no props flagged"}</span>
      <span style="color:var(--ink-1)">props ›</span></div>`
      : click ? `<div class="sub"><span style="color:var(--ink-1)">line chart ›</span></div>` : ""}
  </div>`;
}
function spreadLinkCard(sport, id, r) {
  const ok = r.has_hist;
  return `
  <div class="card final ${ok ? "click" : ""}" ${ok ? on(() => openSpread(KINDOF[sport], id)) : ""}>
    <div class="trow">${logoImg(r.alogo)}${logoImg(r.hlogo)}
      <span class="ab" style="width:auto;font-size:14px">View Game Spread</span></div>
    <div class="sub"><span>${ok ? "live line vs score, with key plays" : "not tracked live — no spread chart"}</span>
      ${ok ? `<span style="color:var(--ink-1)">line chart ›</span>` : ""}</div>
  </div>`;
}
function pastPropCard(wk, key, rec) {
  // only calls get a result; a prop that reached 50% without a call was just watched
  const call = rec.call || rec.pre, hit = !!call && won(call, rec.final);
  const label = call ? (hit ? "WIN ✓" : "LOSS") : "WATCHED";
  return `
  <div class="card ${hit ? "hot" : ""} click" ${on(() => openProp(key, rec))}>
    <div class="trow">${logoImg(rec.logo)}
      <span class="ab" style="width:auto;font-size:14px">${rec.player}${star(rec.player, rec.market)}</span>
      <span class="chip ${hit ? "hot" : "watch"}" style="margin-left:auto">${label}</span>
    </div>
    <div class="mk">${MKT(rec.market)}<b>${rec.final} yds</b></div>
    <div class="sub"><span>${rec.game}</span><span>pregame O ${rec.l0 ?? "—"}</span></div>
  </div>`;
}

function section(key, title, count, legend, cards, empty) {
  return `
  <details class="sect" ${closed.has(key) ? "" : "open"} ontoggle="secToggle('${key}', this.open)">
    <summary>${title} <span class="count">${count ?? ""}</span></summary>
    ${legend ? `<div class="leg">${legend}</div>` : ""}
    ${cards.length ? `<div class="grid">${cards.join("")}</div>` : `<div class="empty">${empty}</div>`}
  </details>`;
}
const PROP_LEG = `Only props the model gives ≥50% to go over are shown.
  <span class="chip hot">TRIGGER</span> ≥70% &nbsp;·&nbsp; <span class="chip warm">NEAR</span> 55–69%
  &nbsp;·&nbsp; <span class="star">★</span> Good Matchup (top player vs bottom-10 defense) &nbsp;·&nbsp; tap a card for line vs production`;
const SPREAD_LEG = `<span class="chip hot">EDGE</span> live line ≥4 pts from fair
  &nbsp;·&nbsp; <span class="chip warm">SWING</span> moved ≥4 pts in ~10 min beyond the score
  &nbsp;·&nbsp; tap a card for line movement + key plays`;

// ---------- data helpers ----------
const regList = (sport, state) => Object.entries(S.games[sport] || {})
  .filter(([, r]) => r.state === state).sort((a, b) => a[1].date.localeCompare(b[1].date));
const pastWeeks = sport => [...new Set(regList(sport, "post").map(([, r]) => r.week))].sort((a, b) => b - a);
const now = () => Date.now();
const watchUpcoming = () => (S.watch?.entries || []).filter(w => !w.kick_iso || new Date(w.kick_iso) > now());

async function loadArchive(sport, wk) {
  const k = `${sport}_w${wk}`;
  if (!(k in S.arch)) {
    S.arch[k] = null;
    try { S.arch[k] = await (await fetch(`archive/${k}.json?` + Date.now())).json(); } catch (e) { S.arch[k] = {}; }
    if (sport === "nfl")
      try { S.parch[wk] = await (await fetch(`archive/props_w${wk}.json?` + Date.now())).json(); } catch (e) { S.parch[wk] = {}; }
    render();
  }
}

// ---------- views ----------
function viewLive() {
  const kind = KINDOF[R.sport], games = S.spread[kind]?.games || [];
  let html = "";
  if (R.sport === "nfl") {
    const all = S.props?.opps || [];
    const mine = all.flatMap(callsOf);
    const active = mine.filter(c => !c.result).sort((a, b) => (b.t || 0) - (a.t || 0) || (b.gc || 0) - (a.gc || 0));
    html += section("nfl-active-calls", "Active calls", `${active.length} pending`,
      `<span class="chip pre">PREGAME</span> a watchlist matchup, the over at the pregame line
       &nbsp;·&nbsp; <span class="chip hot">MODEL PICK</span> the model's live call.`,
      active.map(c => callCard(c, freshCalls.has(c.id))), "No open calls right now.")
      .replace('class="sect"', `class="sect ${Date.now() < flashUntil ? "flash" : ""}"`);
    const opps = all.filter(o => o.p >= P_MIN && !o.noline).sort((a, b) =>
      (onWatch(b.player, b.market) - onWatch(a.player, a.market)) || b.p - a.p);
    const hidden = all.filter(o => !o.noline).length - opps.length;
    html += section("nfl-live-props", "Player props",
      [`${opps.length} shown`, hidden ? `${hidden} below 50% hidden` : ""].filter(Boolean).join(" · "), PROP_LEG,
      opps.map(propLiveCard),
      all.length ? "No live prop is at ≥50% right now." : "No player props live right now — see Upcoming for this week's watchlist.");
  }
  html += section(`${R.sport}-live-games`, `${SPORTNAME[R.sport]} game spreads`, `${games.length} live`, SPREAD_LEG,
    games.map(g => spreadLiveCard(kind, g)), `No live ${SPORTNAME[R.sport]} games right now.`);
  return html;
}

function viewUpcoming() {
  const pre = regList(R.sport, "pre");
  let html = "";
  if (R.sport === "nfl") {
    const w = watchUpcoming();
    html += section("nfl-up-props", "Player props to watch", `week ${S.watch?.week ?? ""} · ${w.length} players`,
      "Top-20 WR / top-10 TE / top-15 RB facing a bottom-10 defense at their position, sorted by kickoff.",
      w.map(x => propPreCard(x)), "No upcoming watchlist matchups.");
  }
  const weeks = [...new Set(pre.map(([, r]) => r.week))].sort((a, b) => a - b);
  for (const wk of weeks) {
    const g = pre.filter(([, r]) => r.week === wk);
    html += section(`${R.sport}-up-games-w${wk}`, `Week ${wk} games`, `${g.length} scheduled`, "",
      g.map(([, r]) => upcomingCard(r)), "");
  }
  if (!weeks.length)
    html += section(`${R.sport}-up-games`, "Games", "", "", [], "No upcoming games loaded yet — the schedule fills in on the next poll.");
  return html;
}

function viewPast() {
  const weeks = pastWeeks(R.sport);
  if (!weeks.length) return `<div class="empty">No finished games recorded yet. Games are archived here as they go final.</div>`;
  const wk = weeks.includes(R.week) ? R.week : weeks[0];
  const k = `${R.sport}_w${wk}`;
  if (!(k in S.arch) || S.arch[k] === null) { loadArchive(R.sport, wk); return `<div class="empty">Loading week ${wk}…</div>`; }
  const finals = regList(R.sport, "post").filter(([, r]) => r.week === wk).reverse()
    .sort((a, b) => (b[1].has_hist ? 1 : 0) - (a[1].has_hist ? 1 : 0));   // charted games first
  let html = "", byGame = {}, summary = "";
  if (R.sport === "nfl") {
    // props flagged ≥50% (or called pregame), per game: calls first, then pregame, then 50–70% leans
    const rank = r => r.call ? 0 : r.pre ? 1 : 2;
    const props = Object.entries(S.parch[wk] || {}).filter(([, r]) => r.signal || r.call || r.pre)
      .sort((a, b) => rank(a[1]) - rank(b[1]) || a[1].player.localeCompare(b[1].player));
    for (const p of props) (byGame[p[0].split("|")[0]] ||= []).push(p);
    const calls = props.filter(([, r]) => r.call), wins = calls.filter(([, r]) => won(r.call, r.final)).length;
    const pres = props.filter(([, r]) => !r.call && r.pre), pwins = pres.filter(([, r]) => won(r.pre, r.final)).length;
    const leans = props.filter(([, r]) => !r.call && !r.pre && r.signal);
    summary = [calls.length ? `model picks ${wins}–${calls.length - wins}` : "",
               pres.length ? `pregame ${pwins}–${pres.length - pwins}` : "", leans.length ? `${leans.length} watched` : ""]
      .filter(Boolean).join(" · ");
    const game = R.game && finals.find(([id]) => id === R.game);
    if (game) {
      const [id, r] = game, mine = byGame[id] || [];
      return `<div class="leg" style="margin-top:14px"><a href="#nfl/past/${wk}" style="color:var(--ink-1)">‹ Week ${wk} games</a></div>`
        + section(`nfl-past-game`, `${r.aabbr} ${r.as} @ ${r.habbr} ${r.hs}`, `${mine.length} props`,
          "WIN/LOSS: a model pick (live) or pregame call on the over, and whether the player cleared the line from that moment. WATCHED: the model rated the over 50–70% but never committed to a call. Tap a card for line vs production.",
          [spreadLinkCard("nfl", id, r), ...mine.map(([key, rec]) => pastPropCard(wk, key, rec))], "");
    }
    const led = S.calls?.calls || [];
    const rec = t => { const r = led.filter(c => (c.type || "live") === t), w = r.filter(c => c.result === "win").length;
                       return r.length ? `${t === "live" ? "Model picks" : "pregame calls"} ${w}–${r.length - w} (${Math.round(w / r.length * 100)}%)` : ""; };
    if (led.length)
      html += `<div class="leg" style="margin-top:14px"><b>Season record: ${[rec("live"), rec("pregame")].filter(Boolean).join(" · ")}</b>
        <br>every settled call, with the model's inputs for model picks, is saved in calls.json</div>`;
  }
  html += section(`${R.sport}-past-games`, "Games", [`${finals.length} final`, summary].filter(Boolean).join(" · "),
    R.sport === "nfl" ? "Tap a game for its player props and spread chart." : "Games with a line chart were tracked live; the rest show the final score only.",
    finals.map(([id, r]) => finalCard(R.sport, id, r, byGame[id] || [])), "No finished games this week.");
  return html;
}

function render() {
  H = [];
  const liveN = { nfl: (S.spread.nflsp?.games || []).length, cfb: (S.spread.cfb?.games || []).length };
  document.getElementById("sporttabs").innerHTML = ["nfl", "cfb"].map(s => `
    <button class="${R.sport === s ? "on" : ""}" ${on(() => go(s, R.view))}>
      ${liveN[s] ? '<span class="livedot"></span>' : ""}${SPORTNAME[s]}</button>`).join("");
  const counts = { live: liveN[R.sport], upcoming: regList(R.sport, "pre").length, past: null };
  document.getElementById("viewtabs").innerHTML = ["live", "upcoming", "past"].map(v => `
    <button class="${R.view === v ? "on" : ""}" ${on(() => go(R.sport, v))}>
      ${v[0].toUpperCase() + v.slice(1)}${counts[v] ? `<span class="n">${counts[v]}</span>` : ""}</button>`).join("");
  const weeks = R.view === "past" ? pastWeeks(R.sport) : [];
  const cur = weeks.includes(R.week) ? R.week : weeks[0];
  document.getElementById("weeks").innerHTML = weeks.length ? `<span class="lbl">Week</span>` + weeks.map(w => `
    <button class="${w === cur ? "on" : ""}" ${on(() => go(R.sport, "past", w))}>${w}</button>`).join("") : "";
  document.getElementById("view").innerHTML =
    R.view === "live" ? viewLive() : R.view === "upcoming" ? viewUpcoming() : viewPast();
}

// ---------- polling ----------
async function refreshProps() {
  try { S.props = await (await fetch("state.json?" + Date.now())).json(); } catch (e) {}
  if (!S.watch || Date.now() - S.watchT > 300e3)
    try { S.watch = await (await fetch("watchlist.json?" + Date.now())).json(); S.watchT = Date.now(); } catch (e) {}
  if (S.props) { lastTs.props = S.props.ts; renderAges(); }
  for (const o of (S.props?.opps || []))
    notifyIf(o.id, o.status, (o.status === "TRIGGER" ? "🔔 TRIGGER: " : "Approaching: ") + o.player,
      `${o.market} O${o.line} · ${o.cum} yds · P=${o.p.toFixed(2)} · ${o.clock}`);
}
async function refreshSpread(kind) {
  let d;
  try { d = await (await fetch(SPREADS[kind].state + "?" + Date.now())).json(); } catch (e) { return; }
  S.spread[kind] = d; lastTs[kind] = d.ts; renderAges();
  for (const g of d.games || [])
    notifyIf(kind + g.id, g.status, `${kind === "cfb" ? "CFB" : "NFL"} ${g.status}: ${g.game}`,
      `live ${g.line} vs fair ${g.fair} · ${g.score} · ${g.clock}`);
}
async function loadAux() {
  for (const kind of ["nflsp", "cfb"])
    try { S.spreadHist[kind] = await (await fetch(SPREADS[kind].hist + "?" + Date.now())).json(); } catch (e) {}
  try { S.nflHist = await (await fetch("nfl_history.json?" + Date.now())).json(); } catch (e) {}
  try { S.calls = await (await fetch("calls.json?" + Date.now())).json(); } catch (e) {}
  for (const sport of ["nfl", "cfb"])
    try { S.games[sport] = await (await fetch(`${sport}_games.json?` + Date.now())).json(); } catch (e) {}
}
let seenCalls = null, freshCalls = new Set(), flashUntil = 0;
function checkNewCalls() {
  const calls = (S.props?.opps || []).flatMap(callsOf).filter(c => !c.result);
  if (seenCalls === null) { seenCalls = new Set(calls.map(o => o.id)); return; }   // no flash on page load
  if (Date.now() > flashUntil) freshCalls.clear();
  const fresh = calls.filter(o => !seenCalls.has(o.id));
  if (!fresh.length) return;
  for (const c of fresh) {
    seenCalls.add(c.id); freshCalls.add(c.id);
    if (c.type === "live" && "Notification" in window && Notification.permission === "granted")
      new Notification(`New call: ${c.player}`, { body: `${MKT(c.market)} O ${c.line} at ${Math.round(c.p * 100)}% · ${c.clock}` });
  }
  flashUntil = Date.now() + 4500;
  closed.delete("nfl-active-calls");   // make sure the list is open to show it
}

async function tick() {
  await Promise.all([refreshProps(), refreshSpread("nflsp"), refreshSpread("cfb")]);
  checkNewCalls();
  render();
}

// ---------- modal charts ----------
const GL = 3600;
let CW = 700, CH = 330;
const CM = { t: 12, r: 14, b: 30, l: 58 };
let MC = null;
const EVCOLOR = { score: "var(--orange)", to: "var(--red)", mom: "var(--yellow)", inj: "#9085e9" };

const clean = pts => {
  const m = new Map();
  for (const [g, v] of pts) if (g > 0 && v !== null && v !== undefined) m.set(Math.min(g, GL), v);
  return [...m.entries()].sort((a, b) => a[0] - b[0]);
};
const gcLabel = gc => {
  const q = Math.min(Math.floor(gc / 900) + 1, 4);
  const rem = Math.round(Math.max(0, q * 900 - gc));
  return `Q${q} ${Math.floor(rem / 60)}:${String(rem % 60).padStart(2, "0")}`;
};
const stepVal = (pts, gc) => {
  let v = null;
  for (const [g, x] of pts) { if (g > gc) break; v = x; }
  return v;
};

function svgChart(cfg) {
  const mob = innerWidth < 640;
  CW = mob ? 380 : 700; CH = mob ? 268 : 320;
  const series = cfg.series.map(s => ({ ...s, pts: s.noclean ? s.pts : clean(s.pts) }));
  const all = series.flatMap(s => s.pts.map(p => p[1]));
  if (!all.length) return `<div class="empty">No history captured yet for this one.</div>`;
  CM.r = cfg.right ? 42 : 14;
  const pw = CW - CM.l - CM.r, ph = CH - CM.t - CM.b;
  let lo, hi;
  if (cfg.mode === "area") { hi = Math.max(7, ...all.map(Math.abs)) * 1.15; lo = -hi; }
  else {
    lo = Math.min(0, ...all); hi = Math.max(...all);
    const pad = Math.max(3, (hi - lo) * 0.12); hi += pad;
  }
  const X = g => CM.l + Math.min(g, GL) / GL * pw;
  const Y = v => CM.t + ph - (v - lo) / (hi - lo) * ph;
  MC = { ...cfg, series, X, Y, lo, hi };
  let s = `<svg id="mcsvg" viewBox="0 0 ${CW} ${CH}">`;
  for (let q = 0; q <= 4; q++)
    s += `<line x1="${X(q * 900)}" x2="${X(q * 900)}" y1="${CM.t}" y2="${CM.t + ph}" stroke="var(--grid)"/>`;
  for (let q = 0; q < 4; q++)
    s += `<text class="tick" x="${X(q * 900 + 450)}" y="${CH - 10}" text-anchor="middle">Q${q + 1}</text>`;
  const step = (hi - lo) > 48 ? 14 : 7;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    if (cfg.mode !== "area" || v !== 0)
      s += `<line x1="${CM.l}" x2="${CM.l + pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-dasharray="1,3"/>`;
    s += `<text class="tick" x="${CM.l - 6}" y="${Y(v) + 3}" text-anchor="end">${cfg.yfmt(v)}</text>`;
  }
  if (cfg.mode === "area") {
    const pts = series[0].pts;
    let curve = `M${X(pts[0][0])},${Y(pts[0][1])}`;
    for (let i = 1; i < pts.length; i++) curve += `H${X(pts[i][0])}V${Y(pts[i][1])}`;
    const area = curve + `V${Y(0)}H${X(pts[0][0])}Z`;
    s += `<clipPath id="cTop"><rect x="0" y="0" width="${CW}" height="${Y(0)}"/></clipPath>
          <clipPath id="cBot"><rect x="0" y="${Y(0)}" width="${CW}" height="${CH - Y(0)}"/></clipPath>
          <path d="${area}" fill="${cfg.hcolor}" opacity="0.28" clip-path="url(#cTop)"/>
          <path d="${area}" fill="${cfg.acolor}" opacity="0.28" clip-path="url(#cBot)"/>
          <path d="${curve}" fill="none" stroke="${cfg.hcolor}" stroke-width="2.4" stroke-linejoin="round" clip-path="url(#cTop)"/>
          <path d="${curve}" fill="none" stroke="${cfg.acolor}" stroke-width="2.4" stroke-linejoin="round" clip-path="url(#cBot)"/>
          <line x1="${CM.l}" x2="${CM.l + pw}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--baseline)" stroke-width="1.4"/>`;
    if (cfg.pregame !== null && cfg.pregame !== undefined)
      s += `<line x1="${CM.l}" x2="${CM.l + pw}" y1="${Y(cfg.pregame)}" y2="${Y(cfg.pregame)}"
            stroke="var(--muted)" stroke-dasharray="5,4" opacity="0.7"/>
            <text class="tick" x="${CM.l + pw - 2}" y="${Y(cfg.pregame) - 4}" text-anchor="end">pregame</text>`;
  } else {
    for (const ser of series) {
      let d = `M${X(ser.pts[0][0])},${Y(ser.pts[0][1])}`;
      for (let i = 1; i < ser.pts.length; i++) d += `H${X(ser.pts[i][0])}V${Y(ser.pts[i][1])}`;
      s += `<path d="${d}" fill="none" stroke="${ser.color}" stroke-width="2.2" stroke-linejoin="round" ${ser.dash ? 'stroke-dasharray="5,4"' : ""}/>`;
      const last = ser.pts[ser.pts.length - 1];
      s += `<text x="${X(last[0]) + 4}" y="${Y(last[1]) + 4}" fill="${ser.color}" font-size="11" font-weight="600">${ser.name}</text>`;
    }
  }
  if (cfg.right) {   // secondary 0–100% axis, colour-matched to its line
    const R = cfg.right, Yr = v => CM.t + ph - v * ph, xr = CM.l + pw;
    for (const [v, c] of [[0.55, "var(--orange)"], [0.7, "var(--green)"]])
      s += `<line x1="${CM.l}" x2="${xr}" y1="${Yr(v)}" y2="${Yr(v)}" stroke="${c}" stroke-dasharray="4,4" opacity="0.45"/>`;
    for (const v of [0, 0.55, 0.7, 1])
      s += `<text class="tick" x="${xr + 6}" y="${Yr(v) + 3}" style="fill:${R.color}">${Math.round(v * 100)}%</text>`;
    s += `<line x1="${xr}" x2="${xr}" y1="${CM.t}" y2="${CM.t + ph}" stroke="${R.color}" opacity="0.5"/>`;
    if (R.pts.length) {
      let d = `M${X(R.pts[0][0])},${Yr(R.pts[0][1])}`;
      for (let i = 1; i < R.pts.length; i++) d += `H${X(R.pts[i][0])}V${Yr(R.pts[i][1])}`;
      s += `<path d="${d}" fill="none" stroke="${R.color}" stroke-width="2" stroke-linejoin="round"/>`;
    }
  }
  for (const st of cfg.stars || []) {   // where each bet was called: x = game clock, y = the line at the call
    const [cx, cy] = [X(st[0]), Y(st[1])], pts = [];
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 3.6 : 8.5;
      pts.push(`${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`);
    }
    s += `<polygon points="${pts.join(" ")}" fill="var(--yellow)" stroke="var(--surface)" stroke-width="1.5"/>`;
  }
  // usage rug: one tick per target/carry (approximate timing from poll deltas)
  if (cfg.rug) for (const g of cfg.rug)
    s += `<line x1="${X(g)}" x2="${X(g)}" y1="${CM.t + ph - 8}" y2="${CM.t + ph}" stroke="var(--green)" stroke-width="2" opacity="0.8"/>`;
  s += `<line class="mxh" x1="0" x2="0" y1="${CM.t}" y2="${CM.t + ph}" stroke="var(--muted)" stroke-dasharray="2,3" visibility="hidden"/>`;
  s += `<rect class="mhit" x="${CM.l}" y="${CM.t}" width="${pw}" height="${ph}" fill="transparent" style="touch-action:pan-y"/>`;
  (cfg.events || []).forEach((ev, i) => {
    const y = stepVal(series[0].pts, ev.gc);
    s += `<circle class="evdot" data-i="${i}" cx="${X(ev.gc)}" cy="${y === null ? CM.t + ph / 2 : Y(y)}" r="${mob ? 4.5 : 5}"
           fill="${EVCOLOR[ev.cls] || "var(--orange)"}" stroke="var(--surface)" stroke-width="2" style="cursor:pointer"/>`;
  });
  return s + "</svg>";
}

let pinnedGc = null;
function setCursor(gc, pin) {
  const lines = document.querySelectorAll("#modal .mxh");
  if (!MC || !lines.length) return;
  gc = Math.max(0, Math.min(GL, gc));
  if (pin) pinnedGc = gc;
  lines.forEach(xh => {   // every panel shares the game-clock x scale
    xh.setAttribute("x1", MC.X(gc)); xh.setAttribute("x2", MC.X(gc));
    xh.setAttribute("visibility", "visible");
  });
  const d = MC.tip ? MC.tip(gc) : {
    stats: MC.series.filter(s => !s.dash).map(s => {
      const v = stepVal(s.pts, gc);
      return [s.name, v === null ? "—" : MC.yfmt(v)];
    }), sub: "" };
  const rd = document.getElementById("mread");
  if (rd) rd.innerHTML = `
    <div class="rtop"><span class="rclk">${gcLabel(gc)}</span><span class="rsit">${d.sub || ""}</span></div>
    <div class="rstats">${d.stats.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;
}

function bindChart() {
  const svg = document.getElementById("mcsvg");
  if (!svg) return;
  pinnedGc = null;
  const gcAt = e => {
    const r = e.currentTarget.ownerSVGElement.getBoundingClientRect();
    return (((e.clientX - r.left) * CW / r.width) - CM.l) / (CW - CM.l - CM.r) * GL;
  };
  document.querySelectorAll("#modal .mhit").forEach(hit => {
    hit.addEventListener("pointerdown", e => {
      if (e.pointerType !== "mouse") {
        try { hit.setPointerCapture(e.pointerId); } catch (err) {}   // capture is a nicety; never block the cursor
        setCursor(gcAt(e), true);
      }
    });
    hit.addEventListener("pointermove", e => {
      // mouse hovers preview; a finger drag moves the pinned line
      setCursor(gcAt(e), e.pointerType !== "mouse");
    });
    hit.addEventListener("pointerleave", e => {
      if (e.pointerType === "mouse" && pinnedGc !== null) setCursor(pinnedGc);
    });
  });
  svg.querySelectorAll(".evdot").forEach(dot =>
    dot.addEventListener("click", e => { e.stopPropagation(); evJump(+dot.dataset.i, true); }));
  const pts = MC.series[0]?.pts || [];
  if (pts.length) setCursor(pts[pts.length - 1][0], true);
}

function evJump(i, fromDot) {
  const ev = MC?.events?.[i];
  if (!ev) return;
  setCursor(ev.gc, true);
  document.querySelectorAll("#evlist .ev.on").forEach(r => r.classList.remove("on"));
  const row = document.getElementById("ev-" + i);
  if (!row) return;
  row.classList.add("on");
  if (fromDot) {
    const list = document.getElementById("evlist");
    list.scrollTop = row.offsetTop - list.offsetTop;
  }
}

// play-by-play text is noisy: drop the clock prefix, formation, and jersey numbers
const tidy = t => (t || "")
  .replace(/^\(\d+:\d+\)\s*/, "")
  .replace(/^(No Huddle-?\s*)?(Shotgun|Pistol|Under Center|Wildcat)?\s*/i, "")
  .replace(/#\d+\s*/g, "")
  .replace(/\s{2,}/g, " ").trim();
const KIND = { "TURNOVER": "Takeaway", "4th DOWN STOP": "4th-down stop", "4th DOWN CONV": "4th-down conversion",
               "DEF TD": "Defensive TD" };
const kindTxt = k => KIND[k] || k.replace(/\bplay\b/, "play").replace(/^🚑 KEY INJURY/, "🚑 Key injury").replace(/^🚑 INJURY/, "🚑 Injury");

// team colors from ESPN can be near-black or near-white; lift them until they
// clear 3:1 against the chart surface, and split teams whose colors collide
const isDark = () => matchMedia("(prefers-color-scheme: dark)").matches;
const hexRgb = h => { h = h.replace("#", ""); if (h.length === 3) h = [...h].map(c => c + c).join("");
  const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgbHex = c => "#" + c.map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
const lumi = c => { const f = v => (v /= 255) <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
  return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
const contrast = (a, b) => { const x = lumi(a), y = lumi(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
function visible(hex) {
  let c = hexRgb(hex);
  const bg = isDark() ? [26, 26, 25] : [252, 252, 251], to = isDark() ? [255, 255, 255] : [0, 0, 0];
  for (let k = 0; k < 12 && contrast(c, bg) < 3; k++) c = c.map((v, j) => v + (to[j] - v) * 0.18);
  return rgbHex(c);
}
function teamColors(hraw, araw) {
  const blue = isDark() ? "#3987e5" : "#2a78d6", orange = isDark() ? "#d95926" : "#eb6834";
  const hc = visible(hraw ? "#" + hraw : blue);
  let ac = visible(araw ? "#" + araw : orange);
  const dist = (a, b) => Math.hypot(...hexRgb(a).map((v, j) => v - hexRgb(b)[j]));
  if (dist(hc, ac) < 90) ac = dist(hc, orange) > dist(hc, blue) ? orange : blue;
  return [hc, ac];
}

function openSpread(kind, id) {
  const sport = SPORTOF[kind];
  const h = S.spreadHist[kind][id] || Object.entries(S.arch)
    .filter(([k, v]) => k.startsWith(sport + "_") && v && v[id]).map(([, v]) => v[id])[0];
  const g = (S.spread[kind]?.games || []).find(x => x.id === id);
  if (!h) return;
  const snaps = h.snaps || [], ha = h.meta.habbr, aa = h.meta.aabbr;
  const [hcolor, acolor] = teamColors(h.meta.hcolor, h.meta.acolor);
  const fav = clean(snaps.map(s => [s[0], s[1] === null || s[1] === undefined ? null : -s[1]]));
  const margins = clean(snaps.map(s => [s[0], s[2]]));
  const yfmt = v => v === 0 ? "EVEN" : `${v > 0 ? ha : aa} -${Math.abs(v)}`;   // exact: lines move in half points
  const events = (h.events || []).map(e => ({
    gc: e[0], label: `${e[2] === "home" ? ha : aa} ${kindTxt(e[1])}`, text: tidy(e[3]), cls: e[6] ?? "score",
    sc: e[4] !== undefined && e[4] !== null ? `${e[5]}–${e[4]}` : "",
  }));
  const scoreAt = gc => {
    let sc = "0–0";
    for (const ev of events) { if (ev.gc > gc) break; if (ev.sc) sc = ev.sc; }
    return sc;
  };
  const sits = snaps.filter(s => s[3]).map(s => [s[0], s[3]]);
  const chart = svgChart({
    mode: "area", yfmt, events, hcolor, acolor,
    pregame: h.pregame !== null && h.pregame !== undefined ? -h.pregame : null,
    series: [{ pts: fav, noclean: 1 }],
    tip: gc => {
      const f = stepVal(fav, gc), m = stepVal(margins, gc);
      return {
        sub: stepVal(sits, gc) || "",
        stats: [
          ["score", scoreAt(gc)],
          ["spread", f === null ? "—" : yfmt(f)],
          ["margin", m === null || m === 0 ? "tied" : `${m > 0 ? ha : aa} +${Math.abs(m)}`],
        ],
      };
    },
  });
  const last = [...events].reverse().find(ev => ev.sc);
  const [asc, hsc] = g?.score ? g.score.split("-") : h.final ? h.final.split("-")
    : (last ? last.sc.split("–") : ["0", "0"]);
  const leg = [["var(--orange)", "score"], ["var(--red)", "turnover"], ["var(--yellow)", "momentum"], ["#9085e9", "injury"]];
  showModal(`
    <div class="bug">
      <div class="tm">${logoImg(h.meta.alogo)}<div><div class="sc">${asc}</div><div class="ab">${aa}</div></div></div>
      <div class="mid"><div class="clk">${g ? g.clock : "Final"}</div><div class="st">${g ? "live" : "not live"}</div></div>
      <div class="tm home"><div style="text-align:right"><div class="sc">${hsc}</div><div class="ab">${ha}</div></div>${logoImg(h.meta.hlogo)}</div>
    </div>
    <div id="mread"></div>
    ${chart}
    <div class="mleg">${leg.map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>
    <div id="evlist">
    ${events.map((ev, i) => `<div class="ev" id="ev-${i}" onclick="evJump(${i})">
      <span class="clk">${gcLabel(ev.gc)}</span><span class="ttl">${ev.label}</span><span class="sc">${ev.sc}</span>
      <span class="txt">${ev.text}</span></div>`).reverse().join("")}</div>`);
  bindChart();
}

function openProp(id, rec) {
  const h = rec || S.nflHist[id], o = rec ? null : (S.props?.opps || []).find(x => x.id === id);
  if (!h) return;
  const snaps = h.snaps || [];
  const rug = [];
  for (let i = 1; i < snaps.length; i++)
    for (let k = 0; k < (snaps[i][2] - snaps[i - 1][2]); k++) rug.push(snaps[i][0]);
  const linePts = clean(snaps.map(s => [s[0], s[3]])), ydsPts = clean(snaps.map(s => [s[0], s[1]]));
  const nevPts = clean(snaps.map(s => [s[0], s[2]])), pPts = clean(snaps.map(s => [s[0], s[4] ?? null]));
  const unit = h.market === "rec" ? "targets" : "carries";
  const call = (o || rec)?.call, pre = (o || rec)?.pre, cum = o ? o.cum : rec?.final;
  const chart = svgChart({
    yfmt: v => v,
    series: [
      { pts: linePts, color: "var(--blue)", name: "O/U line", noclean: 1 },
      { pts: ydsPts, color: "var(--green)", name: "yards", noclean: 1 },
    ],
    rug, events: [],
    right: { pts: pPts, color: "var(--orange)" },
    stars: [pre, call].filter(c => c && c.gc !== undefined).map(c => [Math.max(c.gc, 1), c.line]),
    tip: gc => {
      const pv = stepVal(pPts, gc), n = stepVal(nevPts, gc);
      return {
        sub: n === null ? "" : `${n} ${unit}`,
        stats: [["line", stepVal(linePts, gc) === null ? "—" : `O ${stepVal(linePts, gc)}`],
                ["yards", stepVal(ydsPts, gc) ?? "—"],
                ["Probability", pv === null ? "—" : `${Math.round(pv * 100)}%`]],
      };
    },
  });

  const lead = call || pre;   // the header speaks for the live call when there is one
  const verdict = !lead ? "" : won(lead, cum) ? `<span class="chip hot">WIN</span> cleared O ${lead.line}`
    : lead.result === "loss" ? `<span class="chip watch">LOSS</span> finished ${cum} vs O ${lead.line}`
    : `needs ${Math.round((lead.line - cum) * 10) / 10} more yds to clear the called line (O ${lead.line})`;
  const res = c => won(c, cum) ? "WIN ✓" : c.result === "loss" ? "LOSS" : "pending";
  const bets = !(call || pre) ? "" : `
    <div class="cbets"><div class="ttl">Called Bets</div>
      <table><thead><tr><th>call</th><th>score</th><th>clock</th><th>yards</th><th>line</th><th>result</th></tr></thead>
      <tbody>${[pre, call].filter(Boolean).map(c => `<tr><td>${c.type === "pregame" ? "pregame" : "model pick"}</td>
        <td>${c.score ?? "—"}</td><td>${c.clock}</td><td>${c.cum}</td><td>O ${c.line}</td><td><b>${res(c)}</b></td></tr>`).join("")}
      </tbody></table></div>`;
  showModal(`
    <h3>${logoImg(h.logo)} ${h.player} <span class="meta">${MKT(h.market)} · ${h.game}</span></h3>
    <div class="meta">${verdict || (rec ? `final ${rec.final} yds vs pregame O ${rec.l0}` : "")}</div>
    <div id="mread"></div>
    ${chart}
    <div class="mleg"><span><i style="background:var(--blue)"></i>book line</span>
      <span><i style="background:var(--green)"></i>yards</span>
      <span><i style="background:var(--orange)"></i>Probability · right axis</span>
      ${call || pre ? `<span><span class="star" style="margin:0 4px 0 0">★</span>called</span>` : ""}
      <span>ticks = ${unit}</span></div>
    ${bets}`);
  bindChart();
}

function showModal(html) {
  document.getElementById("modal").innerHTML = `<button class="mclose" onclick="closeModal()" aria-label="close">✕</button>` + html;
  document.getElementById("overlay").style.display = "flex";
  document.body.style.overflow = "hidden";
}
function closeModal() {
  document.getElementById("overlay").style.display = "none";
  document.body.style.overflow = "";
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

loadAux().then(tick);
setInterval(tick, 10000);
setInterval(() => loadAux().then(render), 30000);
</script>
</body>
